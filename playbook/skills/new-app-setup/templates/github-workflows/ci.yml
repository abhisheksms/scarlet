name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck first — the fastest failure; noUnusedLocals/noUnusedParameters
      # catch dead imports before any test spins up.
      - run: pnpm -r typecheck

      # --ci stops Jest writing new snapshots.
      - run: pnpm -r --filter "./packages/**" test -- --ci

      - run: pnpm --filter @<scope>/mobile test -- --ci
        # The mobile package exists from Component 0; if its test suite is
        # empty this passes with "no tests" once configured with passWithNoTests.

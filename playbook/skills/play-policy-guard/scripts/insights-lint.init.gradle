// Adds Google's Play Policy Insights lint rules (com.google.play.policy.insights:insights-lint)
// to the :app module for ONE Gradle run, without editing the generated android/ project or
// the release build:
//
//   ./gradlew :app:lintRelease --init-script insights-lint.init.gradle -PplayPolicyInsightsVersion=0.1.5
//
// This is the same rule set Android Studio shows under Code > Inspect for Play Policy Insights.
def insightsVersion = gradle.startParameter.projectProperties.get("playPolicyInsightsVersion") ?: "0.1.5"

gradle.beforeProject { project ->
    // Configure the moment the Android application plugin is applied, while its DSL is still
    // open. An afterEvaluate hook runs after AGP has already read the lint options.
    project.plugins.withId("com.android.application") {
        project.dependencies.add("lintChecks", "com.google.play.policy.insights:insights-lint:${insightsVersion}")
        project.android.lint {
            // Lint only the app module and its merged manifest. The React Native libraries are
            // separate Gradle projects; linting them adds minutes and noise, and lint crashes
            // on react-native-worklets' Kotlin build script ("Cannot find a KaModule").
            checkDependencies = false
            // Report, don't fail: the checker reads the XML report either way.
            abortOnError = false
            xmlReport = true
            // Google's LoginCredentials detector trips lint's own API guard ("called
            // getMainProject() during module analysis") and lint asks for it to be disabled
            // until the vendor fixes it. It only matters for apps with a login; this has none.
            disable.add("LoginCredentials")
        }
    }
}

// AGP still schedules lint analysis for every React Native library module (44 of them)
// even with checkDependencies off, and lint crashes on react-native-worklets' Kotlin build
// script ("Cannot find a KaModule for the VirtualFile"). For this one run, analyse the app
// module only; the policy-relevant surface is the app and its merged manifest.
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.findAll { it.name.startsWith("lintAnalyze") && it.project.path != ":app" }.each { it.enabled = false }
}


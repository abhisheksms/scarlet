name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests & debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests first: the rule engine's tests are the fastest failure.
      - run: ./gradlew test

      # Then prove the app still assembles. Lint runs here too, on the debug variant.
      - run: ./gradlew assembleDebug lintDebug

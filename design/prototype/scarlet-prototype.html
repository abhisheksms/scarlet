/* ───────────── Switchboard: the app's own design ─────────────
   Layout: one dark display window says the state, one lever sets it, keys act, strips lead on.
   Every size below is dp (CSS px). Type is sp: each font-size is multiplied by --ts (1 or 1.35). */

.sw{
  --ts:1;
  --row-h:max(62px,calc(49.9px * var(--ts)));
  --gest:0px;
  /* inverse roles: the display window is the same in both themes */
  --window:#0E0F11;--on-window:#F0EDE4;--on-window-variant:#A9ADB1;--window-rule:#2C2F33;--w-attention:#FF8A5B;
  --drum-a:#1D2023;--drum-b:#121315;
  /* motion tokens */
  --d-lever:180ms;--d-lamp:240ms;--dl-lamp:120ms;--d-swap:120ms;--dl-swap:180ms;--d-switch:120ms;--d-press:60ms;--d-sheet:220ms;--d-sheet-out:160ms;--d-scrim:160ms;--d-nudge:160ms;
  --e-emph:cubic-bezier(.2,0,0,1);--e-dec:cubic-bezier(0,0,.2,1);--e-acc:cubic-bezier(.3,0,1,1);--e-std:cubic-bezier(.2,0,0,1);
  position:relative;display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;
  background:var(--surface);color:var(--on-surface);
  font-family:'Hanken Grotesk','Noto Sans Devanagari','Helvetica Neue',Arial,sans-serif;
  font-variant-ligatures:none;font-kerning:normal;font-synthesis:none;text-rendering:geometricPrecision;font-size:calc(14px * var(--ts));font-size:round(calc(14px * var(--ts)),1px);line-height:1.35;line-height:round(calc(19px * var(--ts)),1px);font-weight:400;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.sw.light{--press:rgba(22,24,26,.06);--surface:#D2D6D1;--surface-high:#E7EAE6;--surface-low:#C3C8C3;--on-surface:#16181A;--on-surface-variant:#3E4447;--outline:#6B726E;--groove:#A7ADA8;--highlight:#F4F6F3;--lamp-on:#16181A;--lamp-on-hi:#5B6368;--lamp-halo:rgba(22,24,26,.16);--lamp-glass:#9AA19C;--lamp-glass-hi:#C9CEC9;--attention:#B93A12;--key:#16181A;--on-key:#F0EDE4;--handle:#1D2023;--handle-hi:#42474B;--handle-ridge:#6A7075;--handle-drop:rgba(0,0,0,.38);--scrim:rgba(0,0,0,.5)}
.sw.dark{--press:rgba(236,233,224,.07);--surface:#1C1E21;--surface-high:#282B2F;--surface-low:#131416;--on-surface:#ECE9E0;--on-surface-variant:#A9ADB1;--outline:#70757B;--groove:#0E0F10;--highlight:#34383D;--lamp-on:#ECE9E0;--lamp-on-hi:#FFFFFF;--lamp-halo:rgba(236,233,224,.2);--lamp-glass:#3A3E44;--lamp-glass-hi:#5A5F66;--attention:#FF8A5B;--key:#ECE9E0;--on-key:#16181A;--handle:#D9D5CB;--handle-hi:#F6F3EA;--handle-ridge:#8C8A84;--handle-drop:rgba(0,0,0,.6);--scrim:rgba(0,0,0,.62)}

.sw *,.sw *::before,.sw *::after{box-sizing:border-box}
:where(.sw) button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;text-align:left;cursor:pointer;border-radius:0;-webkit-appearance:none;appearance:none;touch-action:manipulation}
:where(.sw) p,:where(.sw) h1,:where(.sw) h2,:where(.sw) h3{margin:0;font-size:inherit;font-weight:inherit}
:where(.sw) :focus{outline:none}
.sw :focus-visible{outline:2px solid var(--on-surface);outline-offset:2px}
.sw .win :focus-visible,.sw .field:focus-visible{outline-color:var(--on-window)}
.sw svg{display:block;flex:none}
.sw .nb{white-space:nowrap}
.sw [tabindex="-1"]:focus-visible{outline:none}

/* reduced motion: every change lands in the same frame */
.sw.rm *,.sw.rm *::before,.sw.rm *::after,.sw.still *,.sw.still *::before,.sw.still *::after{transition-duration:0ms!important;transition-delay:0ms!important;animation-duration:0ms!important;animation-delay:0ms!important}

/* ── frame ── */
.sb{flex:none;height:28px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;font-size:12px;line-height:1;line-height:12px;font-weight:500;color:var(--on-surface-variant)}
.sb-proto{display:none;align-items:center;gap:6px;height:28px;margin-left:-16px;padding:0 14px 0 16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;line-height:1;line-height:11px}
.sb-proto i{display:block;width:12px;height:8px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative}
.sb-fs{display:flex;align-items:center;height:28px;margin-right:-16px;padding:0 16px 0 14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;line-height:1;line-height:11px;white-space:nowrap}
.sb-later{flex:1;text-align:center;font-size:10px;line-height:1;line-height:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-proto i::after{content:"";position:absolute;left:0;right:0;top:1px;height:2px;background:currentColor}
.view{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.scr{display:flex;flex-direction:column;gap:12px;padding:0 16px 24px;min-height:100%}
.scr.home{gap:16px;padding:8px 16px 0}
.scr.is-typing{padding-bottom:340px}
.gest{flex:none;height:var(--gest)}
.gest-pill{display:none}

/* ── the ad slot: a tenant with its own sill ── */
.slot{flex:none;background:var(--surface-low);box-shadow:inset 0 1px 0 var(--groove),inset 0 2px 0 var(--highlight);padding-bottom:var(--gest);position:relative}
.slot-sill{height:calc(20px * var(--ts));display:flex;align-items:center;padding:0 16px;font-weight:600;font-size:calc(11px * var(--ts));font-size:round(calc(11px * var(--ts)),1px);line-height:1;line-height:round(calc(11px * var(--ts)),1px);letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant)}
.slot-ad{height:60px;display:flex;align-items:stretch;justify-content:center}
.testad{width:100%;height:60px;background:#F2F2F2;color:#3A3A3A;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;line-height:1.2;line-height:16px}
.testad b{display:inline-block;font-weight:400;border:1px solid #8A8A8A;border-radius:3px;padding:6px 12px;font-size:12px;line-height:1.2;line-height:14px}

/* ── the display window ── */
.win{position:relative;flex:none;display:flex;flex-direction:column;min-height:var(--win-h,0px);background:var(--window);color:var(--on-window);border-radius:6px;box-shadow:inset 0 2px 0 #000,0 1px 0 var(--highlight)}
.win-status{position:relative;padding:18px 16px 16px}
.win-status.is-first{padding-bottom:12px}
.st{display:flex;gap:12px;margin-right:40px}
.st-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.say{font-size:calc(21px * var(--ts));font-size:round(calc(21px * var(--ts)),1px);line-height:1.3;line-height:round(calc(27px * var(--ts)),1px);font-weight:500}
.say-sub{font-size:calc(15px * var(--ts));font-size:round(calc(15px * var(--ts)),1px);line-height:1.35;line-height:round(calc(20px * var(--ts)),1px);color:var(--on-window-variant)}
.st-bars{flex:none;display:flex;gap:4px;margin-top:calc(6px * var(--ts))}
.st-bars i{display:block;width:5px;height:calc(15px * var(--ts));background:var(--on-window)}
.st-sq{flex:none;width:14px;height:14px;margin-top:calc(7px * var(--ts));background:var(--w-attention)}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--window-rule);font-size:calc(14px * var(--ts));font-size:round(calc(14px * var(--ts)),1px);line-height:1.35;line-height:round(calc(19px * var(--ts)),1px);color:var(--on-window-variant)}
.legend b{font-weight:600;font-size:calc(12px * var(--ts));font-size:round(calc(12px * var(--ts)),1px);line-height:1.35;line-height:round(calc(16px * var(--ts)),1px);letter-spacing:.1em;text-transform:uppercase;color:var(--on-window);margin-right:8px}
.gear{position:absolute;right:2px;top:2px;z-index:2;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--on-window-variant)}
.st-ghost{position:absolute;left:0;right:0;top:0;padding:18px 16px 16px;pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:auto;border-top:1px solid var(--window-rule)}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 8px 14px 16px;min-height:96px}
.tile + .tile{border-left:1px solid var(--window-rule)}
.tiles.is-empty .tile{gap:3px;padding:10px 8px 12px 16px;min-height:60px}
.tile-cap{display:flex;align-items:center;justify-content:space-between;gap:4px;font-weight:600;font-size:calc(12px * var(--ts));font-size:round(calc(12px * var(--ts)),1px);line-height:1.3;line-height:round(calc(16px * var(--ts)),1px);letter-spacing:.1em;text-transform:uppercase;color:var(--on-window-variant)}
.tile-num{font-weight:500;font-size:calc(40px * var(--ts));font-size:round(calc(40px * var(--ts)),1px);line-height:1.05;line-height:round(calc(42px * var(--ts)),1px)}
.tile-unit{font-size:calc(14px * var(--ts));font-size:round(calc(14px * var(--ts)),1px);line-height:1.3;line-height:round(calc(18px * var(--ts)),1px);color:var(--on-window-variant)}
.tile-line{display:flex;align-items:center;gap:8px;font-size:calc(15px * var(--ts));font-size:round(calc(15px * var(--ts)),1px);line-height:1.35;line-height:round(calc(20px * var(--ts)),1px)}
.tile-cap + .tile-line{margin-top:4px}
.tiles.is-empty .tile-cap + .tile-line{margin-top:0}

.tile:active{background:rgba(240,237,228,.08)}
button.strip:active,.hrow:active,.frow:active{background:var(--press)}

/* parts joined by a middle dot. Each dot sits in the gap before its part, so a part that starts a new line has its dot cut off by the edge. */
.dots{display:flex;flex-wrap:wrap;column-gap:.9em;overflow:hidden}
.dots > span{position:relative}
.dots > span + span::before{content:"·";position:absolute;right:100%;width:.9em;text-align:center}

/* marks: filled is blocked, a ring is silenced */
.mk{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%}
.mk-b{background:currentColor}
.mk-s{border:2.5px solid currentColor}

/* ── the lever ── */
.lever{position:relative;flex:none;background:var(--surface-high);border-radius:6px;box-shadow:0 0 0 1px var(--groove),0 2px 0 var(--groove)}
.lever-slot{position:absolute;z-index:1;pointer-events:none;left:28px;top:18px;bottom:18px;width:16px;border-radius:8px;background:var(--window);box-shadow:inset 0 2px 3px #000,0 1px 0 var(--highlight)}
.lever-row{display:grid;grid-template-columns:72px minmax(0,1fr) 60px;align-items:center;width:100%;height:var(--row-h)}
.lever-row + .lever-row{background:linear-gradient(var(--groove),var(--groove)) 72px 0/calc(100% - 72px) 1px no-repeat}
.lever-tick{justify-self:end;margin-right:10px;width:10px;height:2px;background:var(--outline)}
.lever-row.is-set .lever-tick{visibility:hidden}
.lever-label{font-weight:600;font-size:calc(26px * var(--ts));font-size:round(calc(26px * var(--ts)),1px);line-height:1.15;line-height:round(calc(30px * var(--ts)),1px);letter-spacing:.04em;text-transform:uppercase;color:var(--on-surface-variant);white-space:nowrap}
.lever-row.is-set .lever-label{font-weight:700;color:var(--on-surface)}
.lever-handle{position:absolute;z-index:2;left:13px;top:0;width:46px;height:36px;border-radius:4px;background:linear-gradient(var(--handle-hi),var(--handle) 55%);box-shadow:0 3px 0 var(--handle-drop),inset 0 1px 0 rgba(255,255,255,.25);touch-action:none;cursor:grab;
  transform:translateY(calc(var(--stop) * var(--row-h) + (var(--row-h) - 36px) / 2));transition:transform var(--d-lever) var(--e-emph)}
.lever-handle.is-drag{transition:none;cursor:grabbing}
.lever-handle i{position:absolute;left:10px;right:10px;height:2px;background:var(--handle-ridge)}
.lever-handle i:nth-child(1){top:11px}.lever-handle i:nth-child(2){top:17px}.lever-handle i:nth-child(3){top:23px}
.lever-handle.is-nudge-down{animation:nudgeD var(--d-nudge) var(--e-std)}
@keyframes nudgeD{50%{transform:translateY(calc(var(--stop) * var(--row-h) + (var(--row-h) - 36px) / 2 + 7px))}}

.lamp{position:relative;justify-self:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--outline);background:radial-gradient(circle at 36% 30%,var(--lamp-glass-hi),var(--lamp-glass) 62%)}
.lamp::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--outline);background:radial-gradient(circle at 36% 30%,var(--lamp-on-hi),var(--lamp-on) 58%);box-shadow:0 0 0 5px var(--lamp-halo);opacity:0;transition:opacity 0ms}
.lamp.is-lit::after{opacity:1;transition:opacity var(--d-lamp) var(--e-dec) var(--dl-lamp)}
.lamp.is-held{box-shadow:inset 0 0 0 3px var(--lamp-on)}
.ring{justify-self:center;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--outline)}
.ring.is-lit{border:3.5px solid var(--on-surface)}

/* ── keys ── */
.bay{flex:none;min-height:var(--bay-h,0px)}
.keys-block{display:flex;flex-direction:column;gap:8px}
.cap{font-weight:600;font-size:calc(12px * var(--ts));font-size:round(calc(12px * var(--ts)),1px);line-height:1.3;line-height:round(calc(16px * var(--ts)),1px);letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant)}
.keys{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),minmax(max-content,1fr));padding-bottom:3px}
.keys.is-two{grid-template-columns:repeat(2,minmax(max-content,1fr));gap:11px 8px}
.keys.is-stack{grid-template-columns:minmax(0,1fr);gap:11px}
.key{min-height:48px;padding:6px;white-space:nowrap;text-align:center;background:var(--surface-high);border-radius:4px;box-shadow:0 0 0 1px var(--outline),0 3px 0 var(--groove);font-weight:600;font-size:calc(15px * var(--ts));font-size:round(calc(15px * var(--ts)),1px);line-height:1.2;line-height:round(calc(18px * var(--ts)),1px);letter-spacing:.03em;text-transform:uppercase;transition:transform var(--d-press) linear}
.key:active{transform:translateY(3px);box-shadow:0 0 0 1px var(--outline)}
.key.is-latched{background:var(--key);color:var(--on-key);box-shadow:0 0 0 1px var(--key);transform:translateY(3px)}
.plate .key{background:var(--highlight)}
.plate .key.is-latched{background:var(--key)}
.key-main{display:block;min-height:56px;width:100%;padding:8px 12px;text-align:center;background:var(--key);color:var(--on-key);border-radius:4px;box-shadow:0 3px 0 var(--handle-drop);font-weight:700;font-size:calc(17px * var(--ts));font-size:round(calc(17px * var(--ts)),1px);line-height:1.25;line-height:round(calc(21px * var(--ts)),1px);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px;transition:transform var(--d-press) linear}
.key-main:active{transform:translateY(3px);box-shadow:none}
.note{font-size:calc(13px * var(--ts));font-size:round(calc(13px * var(--ts)),1px);line-height:1.4;line-height:round(calc(18px * var(--ts)),1px);color:var(--on-surface-variant)}

/* ── strips ── */
.strips{flex:none;display:flex;flex-direction:column;border-top:1px solid var(--groove);box-shadow:inset 0 1px 0 var(--highlight)}
.strip{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 0;width:100%;border-bottom:1px solid var(--groove)}
.strips > .strip:last-child{border-bottom:0}
.strips.is-closed > .strip:last-child{border-bottom:1px solid var(--groove)}
.strip.is-head{border-bottom:0;padding-top:0;min-height:49px}
.strip-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.strip-t{font-weight:600;font-size:calc(13px * var(--ts));font-size:round(calc(13px * var(--ts)),1px);line-height:1.3;line-height:round(calc(17px * var(--ts)),1px);letter-spacing:.08em;text-transform:uppercase}
.strip-d{font-size:calc(14px * var(--ts));font-size:round(calc(14px * var(--ts)),1px);line-height:1.3;line-height:round(calc(18px * var(--ts)),1px);color:var(--on-surface-variant)}
.strip-v{flex:none;font-weight:500;font-size:calc(15px * var(--ts));font-size:round(calc(15px * var(--ts)),1px);line-height:1.3;line-height:round(calc(20px * var(--ts)),1px)}
.pswitch{flex:none;position:relative;width:46px;height:26px;border-radius:4px;background:var(--window);box-shadow:inset 0 2px 2px #000,0 1px 0 var(--highlight)}
.pswitch::after{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:3px;background:linear-gradient(var(--handle-hi),var(--handle) 60%);box-shadow:0 1px 0 var(--handle-drop);transition:transform var(--d-switch) var(--e-std)}
.is-on > .pswitch::after{transform:translateX(20px)}

/* ── inner screens ── */
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;min-height:52px;margin:0 -12px;background:var(--surface)}
.hdr-b{flex:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.hdr-t{flex:1;min-width:0;margin:0 4px;font-weight:600;font-size:calc(18px * var(--ts));font-size:round(calc(18px * var(--ts)),1px);line-height:1.2;line-height:round(calc(22px * var(--ts)),1px);letter-spacing:.08em;text-transform:uppercase}
.hdr-a{flex:none;min-height:48px;display:flex;align-items:center;padding:0 12px;font-weight:600;font-size:calc(13px * var(--ts));font-size:round(calc(13px * var(--ts)),1px);line-height:1.3;line-height:round(calc(17px * var(--ts)),1px);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--groove);box-shadow:inset 0 1px 0 var(--highlight)}
.sec.is-first{padding-top:0;border-top:0;box-shadow:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.h2{font-weight:600;font-size:calc(13px * var(--ts));font-size:round(calc(13px * var(--ts)),1px);line-height:1.3;line-height:round(calc(17px * var(--ts)),1px);letter-spacing:.1em;text-transform:uppercase}
.lead{font-size:calc(15px * var(--ts));font-size:round(calc(15px * var(--ts)),1px);line-height:1.35;line-height:round(calc(20px * var(--ts)),1px);font-weight:500}
.body{font-size:calc(14px * var(--ts));font-size:round(calc(14px * var(--ts)),1px);line-height:1.35;line-height:round(calc(19px * var(--ts)),1px)}
.dim{color:var(--on-surface-variant)}
.empty{padding-top:8px;font-size:calc(15px * var(--ts));font-size:round(calc(15px * var(--ts)),1px);line-height:1.4;line-height:round(calc(21px * var(--ts)),1px);color:var(--on-surface-variant)}

/* ── history ── */
.hist{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:12px}
.day{grid-column:1/-1;padding:14px 0 6px;border-bottom:1px solid var(--groove)}
.day:first-child{padding-top:2px}
.hrow{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:start;width:100%;min-height:56px;padding:9px 0 10px;border-bottom:1px solid var(--groove)}
/* before subgrid (browsers older than late 2023) the time column takes a measured width */
@supports not (grid-template-columns:subgrid){
  .hist{display:block}
  .hrow{grid-template-columns:var(--time-w,4.5em) minmax(0,1fr);column-gap:12px}
}
.hrow-time{text-align:right;font-size:calc(15px * var(--ts));font-size:round(calc(15px * var(--ts)),1px);line-height:calc(22px * var(--ts));line-height:round(calc(22px * var(--ts)),1px);color:var(--on-surface-variant);white-space:nowrap}
.hrow-main{display:flex;flex-direction:column;gap:1px;min-width:0}
.num{font-weight:500;font-size:calc(17px * var(--ts));font-size:round(calc(17px * var(--ts)),1px);line-height:calc(22px * var(--ts));line-height:round(calc(22px * var(--ts)),1px);white-space:nowrap}
.hrow-sub{display:flex;align-items:center;flex-wrap:wrap;column-gap:8px;font-size:calc(14px * var(--ts));font-size:round(calc(14px * var(--ts)),1px);line-height:1.4;line-height:round(calc(20px * var(--ts)),1px);color:var(--on-surface-variant)}
.hrow-allow{font-size:calc(14px * var(--ts));font-size:round(calc(14px * var(--ts)),1px);line-height:1.4;line-height:round(calc(20px * var(--ts)),1px);font-weight:500}

/* ── overlays: scrim, sheet, dialog ── */
.layer{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.layer.is-center{justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fadeIn var(--d-scrim) linear}
.plate{position:relative;background:var(--surface-high);color:var(--on-surface)}
.sheet{border-radius:6px 6px 0 0;box-shadow:inset 0 1px 0 var(--highlight);padding:8px 16px calc(16px + var(--gest));display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 40px);overflow-y:auto;scrollbar-width:none;animation:rise var(--d-sheet) var(--e-emph)}
.sheet-grip{align-self:center;flex:none;width:32px;height:4px;border-radius:2px;background:var(--outline)}
.sheet-num{font-weight:500;font-size:calc(21px * var(--ts));font-size:round(calc(21px * var(--ts)),1px);line-height:1.3;line-height:round(calc(27px * var(--ts)),1px);white-space:nowrap}
.thiscall{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--groove);border-bottom:1px solid var(--groove)}
.thiscall-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.key-sm{flex:none;padding:6px 14px}
.facts{display:flex;flex-direction:column;gap:6px}
.facts-split{display:flex;flex-wrap:wrap;column-gap:20px;row-gap:2px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:calc(14px * var(--ts));font-size:round(calc(14px * var(--ts)),1px);line-height:1.4;line-height:round(calc(20px * var(--ts)),1px)}
.kv span:first-child{color:var(--on-surface-variant)}
.kv span:last-child{text-align:right}
.layer.is-leaving .sheet{animation:fall var(--d-sheet-out) var(--e-acc) forwards}
.layer.is-leaving .scrim,.layer.is-leaving .dialog,.layer.is-leaving .standin{animation:fadeOut var(--d-sheet-out) linear forwards}
.dialog{margin:0 24px;border-radius:6px;box-shadow:0 0 0 1px var(--groove),0 3px 0 var(--groove);padding:20px 16px 16px;display:flex;flex-direction:column;gap:10px;animation:fadeIn var(--d-scrim) linear}
.dialog-t{font-weight:500;font-size:calc(21px * var(--ts));font-size:round(calc(21px * var(--ts)),1px);line-height:1.3;line-height:round(calc(27px * var(--ts)),1px)}
.dialog .keys{margin-top:10px}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes fall{to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}

/* ── field ── */
.field{-webkit-user-select:text;user-select:text;display:block;width:100%;min-height:56px;margin:0;padding:0 14px;border:0;border-radius:4px;background:var(--window);color:var(--on-window);box-shadow:inset 0 2px 0 #000,0 1px 0 var(--highlight);font:inherit;font-size:calc(17px * var(--ts));font-size:round(calc(17px * var(--ts)),1px);line-height:1.3;line-height:round(calc(22px * var(--ts)),1px);font-weight:500;letter-spacing:.02em;caret-color:var(--on-window);-webkit-appearance:none;appearance:none}
.field::placeholder{color:var(--on-window-variant);opacity:1;font-weight:400;letter-spacing:0}
.field.is-error{box-shadow:inset 0 2px 0 #000,0 0 0 2px var(--on-surface)}
.err{display:flex;align-items:center;gap:8px;font-size:calc(14px * var(--ts));font-size:round(calc(14px * var(--ts)),1px);line-height:1.35;line-height:round(calc(19px * var(--ts)),1px);font-weight:500}
.err i{display:block;flex:none;width:10px;height:10px;background:var(--on-surface)}
.arow{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--groove)}
.arow-t{flex:1;min-width:0;display:flex;flex-direction:column}
.arow-x{flex:none;width:48px;height:48px;margin-right:-12px;display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant)}

/* ── statistics ── */
.counter{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.drums{display:flex;gap:3px;flex:none;font-weight:500;font-size:calc(40px * var(--ts));font-size:round(calc(40px * var(--ts)),1px);line-height:1;line-height:round(calc(40px * var(--ts)),1px)}
.drum{position:relative;width:calc(34px * var(--ts));height:calc(54px * var(--ts));border-radius:3px;background:linear-gradient(var(--drum-a),var(--drum-b));box-shadow:inset 0 0 0 1px var(--window-rule);display:flex;align-items:center;justify-content:center}
.drum::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
.drum.is-lead{color:var(--on-window-variant)}
.counter-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.counter-t .cap{color:var(--on-window-variant)}
.statwin{padding:16px;gap:14px;min-height:0}
.mile{display:flex;flex-direction:column;gap:6px}
.mile-bar{position:relative;height:8px;border-radius:2px;background:var(--window-rule)}
.mile-fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--on-window)}
.mile-notch{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--window)}
.mile-l{display:flex;justify-content:space-between;gap:8px;font-size:calc(13px * var(--ts));font-size:round(calc(13px * var(--ts)),1px);line-height:1.3;line-height:round(calc(17px * var(--ts)),1px);color:var(--on-window-variant)}
.saved{font-size:calc(13px * var(--ts));font-size:round(calc(13px * var(--ts)),1px);line-height:1.3;line-height:round(calc(17px * var(--ts)),1px);color:var(--on-window-variant);padding-top:10px;border-top:1px solid var(--window-rule)}

.days{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:0 -4px}
.days::after{content:"";position:absolute;left:4px;right:4px;top:calc(var(--val-h,0px) + 101px);height:2px;background:var(--outline);pointer-events:none}
.dcol{display:flex;flex-direction:column;padding:0 4px 2px;min-width:0}

// base = target minus what the listed rows already account for, so deleting a row moves every figure that counts it
function mkBase(kind) {
  const D = DATA[kind], rows = mkRows(D.rows);
  const z = { all: [0, 0], daily: [0, 0, 0, 0, 0, 0, 0].map(() => [0, 0]), d30: 0, prev7: 0, prev30: 0, pct7: null, pct30: null, week0: 0, d300: 0,
    wd: { 7: new Array(7).fill(0), 30: new Array(7).fill(0), 90: new Array(7).fill(0) },
    hr: { 7: new Array(24).fill(0), 30: new Array(24).fill(0), 90: new Array(24).fill(0) },
    top: { 7: {}, 30: {}, 90: {} }, num: {}, truncated: !!D.truncated };
  if (!D.t) return { rows, base: z };
  const t = D.t, b = z;
  b.all = t.all.slice(); b.daily = t.daily.map(x => x.slice()); b.d30 = t.d30;
  b.prev7 = t.prev7; b.prev30 = t.prev30; b.pct7 = t.pct7; b.pct30 = t.pct30;
  b.week0 = t.daily.reduce((n, x) => n + x[0] + x[1], 0); b.d300 = t.d30;
  for (const p of [7, 30, 90]) { b.wd[p] = t.wd[p].slice(); b.hr[p] = t.hr[p].slice(); b.top[p] = Object.assign({}, t.top[p]); }
  for (const k in t.num) b.num[k] = { b: t.num[k].b, s: t.num[k].s, first: t.num[k].first ? dt(t.num[k].first) : null };
  for (const r of rows) {
    const i = r.a === 'B' ? 0 : 1, k = keyOf(r.n);
    b.all[i]--; b.daily[dayIndex(r.t)][i]--; b.d30--;
    for (const p of [7, 30, 90]) { b.wd[p][r.t.getDay()]--; b.hr[p][r.t.getHours()]--; if (k !== 'none') b.top[p][k]--; }
    b.num[k][r.a === 'B' ? 'b' : 's']--;
  }
  return { rows, base: b };
}

// The last two words of a sentence stay on one line, so no line holds a single word.
// Done by hand because browsers that are asked to do it (text-wrap: pretty) each break the lines differently.
const TIE = '.legend p,.note,.strip-t,.strip-d,.lead,.body,.empty,.saved,.lic b,.lic span';
function tieWidows(root) {
  for (const el of root.querySelectorAll(TIE)) {
    let n = el.lastChild;
    while (n && n.nodeType === 1) n = n.classList.contains('later') ? n.previousSibling : n.lastChild;   // a Later tag is not part of the sentence
    if (!n || n.nodeType !== 3) continue;
    const s = n.nodeValue, i = s.lastIndexOf(' ');
    if (i > 0 && s.indexOf(' ') !== i && s.length - i <= 13) n.nodeValue = s.slice(0, i) + '\u00A0' + s.slice(i + 1);
  }
}
// The sentence in the display, and a dialog's question, are balanced: the narrowest box that keeps their number of lines,
// widened again if that left a line of one word and a wider box avoids it.
// Browsers offer this too (text-wrap: balance) but need not agree on where the lines end. This gives one answer everywhere.
const BALANCE = '.say,.say-sub,.dialog-t';
function balanceText(root) {
  for (const el of root.querySelectorAll(BALANCE)) {
    el.style.maxWidth = '';
    const full = el.clientWidth, h = el.offsetHeight;
    if (!full || !h) continue;
    let lo = 40, hi = full;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      el.style.maxWidth = mid + 'px';
      if (el.offsetHeight > h) lo = mid + 1; else hi = mid;
    }
    let w = hi;
    el.style.maxWidth = w + 'px';
    if (w < full && loneWord(el)) {
      for (let t = w + 2; t <= full; t += 2) { el.style.maxWidth = t + 'px'; if (!loneWord(el)) { w = t; break; } }
    }
    el.style.maxWidth = w < full ? w + 'px' : '';
  }
}
// Does any line of this text hold a single word?
function loneWord(el) {
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), rg = document.createRange(), gap = (parseFloat(getComputedStyle(el).lineHeight) || 16) * 0.6, counts = [];
  let top = null;
  while (walk.nextNode()) {
    const n = walk.currentNode, re = /\S+/g;
    let m;
    while ((m = re.exec(n.nodeValue))) {
      rg.setStart(n, m.index); rg.setEnd(n, m.index + m[0].length);
      let t = null;
      for (const r of rg.getClientRects()) if (r.width > 0) { t = r.top; break; }
      if (t === null) continue;
      if (top === null || t > top + gap) counts.push(0);
      counts[counts.length - 1]++;
      top = t;
    }
  }
  return counts.length > 1 && counts.some(c => c === 1);
}

const hindi = () => S.later.hindi && S.screen === 'home';
function L(k, vars) {
  let s = (hindi() && HI[k] != null) ? HI[k] : T[k];
  if (vars) for (const v in vars) s = s.replace('{' + v + '}', vars[v]);

/* ── times and numbers, as the phone is set ── */
const NB = ' ';
const p2 = n => String(n).padStart(2, '0');
function fTime(d) {
  const h = d.getHours(), m = p2(d.getMinutes());
  if (S.clock === 24) return p2(h) + ':' + m;
  return (h % 12 || 12) + ':' + m + NB + (h < 12 ? 'AM' : 'PM');
}
function fHour(h) {
  if (S.clock === 24) return p2(h) + ':00';
  return (h % 12 || 12) + NB + (h < 12 ? 'AM' : 'PM');
}
const fDate = d => d.getDate() + NB + MON[d.getMonth()] + NB + d.getFullYear();
const fDateTime = d => fDate(d) + ', ' + fTime(d);
const dayNo = d => Math.round(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 864e5);
const dayDiff = d => dayNo(d) - dayNo(NOW);          // 0 today, -1 yesterday, 1 tomorrow
function fUntil(d) {
  const dd = dayDiff(d);
  if (dd === 0) return fTime(d);
  if (dd === 1) return L('tomorrow', { t: fTime(d) });
  return fDateTime(d);
}
function fDay(d) {
  const dd = dayDiff(d);
  return dd === 0 ? 'Today' : dd === -1 ? 'Yesterday' : fDate(d);
}
const fNum = n => n.toLocaleString('en-IN');
const plural = (n, one, many) => fNum(n) + ' ' + (n === 1 ? one : many);
const calls = n => plural(n, 'call', 'calls');
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd', 'th', 'th', 'th', 'th', 'th', 'th'][n % 10]);
function fSaved(total) {
  const min = Math.floor(total * 30 / 60);
  if (min < 1) return 'under a minute';
  if (min < 60) return min + ' min';
  return fNum(Math.floor(min / 60)) + ' hr ' + (min % 60) + ' min';
}

/* ── counting: every figure on every screen comes from here ── */
function stats() {
  const b = S.base, rows = S.rows;
  const all = { b: b.all[0], s: b.all[1] };
  const daily = b.daily.map(x => ({ b: x[0], s: x[1] }));
  const wd = b.wd[S.period].slice(), hr = b.hr[S.period].slice(), hr7 = b.hr[7].slice();
  const top = Object.assign({}, b.top[S.period]);
  const latest = {};
  for (const r of rows) {
    const f = r.a === 'B' ? 'b' : 's', k = keyOf(r.n);
    all[f]++; daily[dayIndex(r.t)][f]++;
    wd[r.t.getDay()]++; hr[r.t.getHours()]++; hr7[r.t.getHours()]++;
    if (r.n != null) { const kk = k || r.n; top[kk] = (top[kk] || 0) + 1; if (!latest[kk] || r.t > latest[kk]) latest[kk] = r.t; }
  }
  const total = all.b + all.s;
  const week = daily.reduce((a, d) => ({ b: a.b + d.b, s: a.s + d.s }), { b: 0, s: 0 });
  const weekTotal = week.b + week.s;
  const d30 = b.d30 + rows.length;
  const pct = (cur, prev, given, at0) => (given != null && cur === at0) ? given : (prev ? Math.round((cur - prev) * 100 / prev) : null);
  const busiest = a => { const m = Math.max.apply(null, a); return m === 0 ? null : a.indexOf(m); };
  const order = 'abcde';
  const topList = Object.keys(top).filter(k => top[k] > 0).map(k => ({ n: N[k] || k, c: top[k], k }))
    .sort((x, y) => y.c - x.c || ((latest[y.k] || 0) - (latest[x.k] || 0)) || (order.indexOf(x.k) - order.indexOf(y.k))).slice(0, 10);
  const reached = LADDER.filter(m => m <= total).pop() || null;
  const next = LADDER.find(m => m > total) || null;
  // the 30-day line only says something once the history is older than a week
  const older = d30 > weekTotal || total > d30;
  return {
    all, total, daily, week, weekTotal, today: daily[6], d30, older,
    pct7: pct(weekTotal, b.prev7, b.pct7, b.week0), pct30: pct(d30, b.prev30, b.pct30, b.d300),
    busiest7: busiest(hr7), wd, hr, busyWd: busiest(wd), busyHr: busiest(hr), top: topList, reached, next,
  };
}

/* ── a small DOM morph, so elements persist between renders and their transitions can run ── */
function morph(from, to) {
  for (const a of Array.from(from.attributes)) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name);
  for (const a of Array.from(to.attributes)) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  const fc = Array.from(from.childNodes), tc = Array.from(to.childNodes);
  for (let i = 0; i < tc.length; i++) {
    const f = fc[i], t = tc[i];

function drumsH(n) {

function mileH(total, reached, next) {

      body = `<span class="dval">${tot ? fNum(tot) : ''}</span><span class="dbar">${d.s ? `<i class="s" style="height:${hs}px"></i>` : ''}${d.b ? `<i class="b" style="height:${hb}px"></i>` : ''}</span>`;

/* ───────────── rendering, motion and what each control does ───────────── */

const M = { key: '', winH: 0, bayH: 0, timeW: 0 };
let K = 1;               // scale of the phone on the bench

/* The display and the bay are one size in every state: the tallest thing each can ever show at this width and text size.
   In Compose this is a custom layout that measures the candidates; here a hidden box does it. */
function computeMetrics() {
  const ph = $('#phone'), w = (ph && ph.clientWidth) || 360, st = stats();
  const sig = [w, S.ts, S.clock, hindi(), st.total === 0, st.today.b + st.today.s, st.week.b, st.week.s].join('|');
  if (M.key === sig) return;
  M.key = sig;
  const box = $('#measure');
  box.className = ['sw', S.theme, hindi() ? 'hi' : ''].join(' ');
  box.style.cssText = `--ts:${S.ts};width:${w}px`;
  const h = html => { box.innerHTML = `<div style="width:${w - 32}px">${html}</div>`; fitKeys(box); tieWidows(box); return box.firstElementChild.getBoundingClientRect().height; };
  const win = (kind, o) => h(`<div class="win" style="min-height:0">${statusH(kind, o).replace(' id="status"', '')}</div>`);
  let sMax = Math.max(win('off'), win('cannot'), win('role'));
  for (const scope of ['all', 'intl']) for (const k of ['silence', 'block']) sMax = Math.max(sMax, win(k, { scope }));
  for (const until of [fTime(at(0, 20, 30)), L('tomorrow', { t: fTime(at(1, 19, 30)) })]) sMax = Math.max(sMax, win('paused', { until }));
  if (st.total === 0) for (const scope of ['all', 'intl']) sMax = Math.max(sMax, win('first', { scope }));
  M.winH = Math.ceil(sMax + h(`<div class="win" style="min-height:0">${tilesH(st)}</div>`));
  M.bayH = Math.ceil(Math.max(h(pauseKeys()), h(mainKey(L('resume'), 'x')), h(mainKey(L('role_btn'), 'x')), h(`<p class="note">${esc(L('privacy'))}</p>`)));
  // the widest a time can be, for History's time column where the browser has no subgrid
  box.innerHTML = [at(0, 10, 48), at(0, 22, 48)].map(d => `<span class="hrow-time" style="display:inline-block">${fTime(d)}</span>`).join('<br>');
  M.timeW = Math.ceil(Math.max.apply(null, Array.from(box.children, e => e.getBoundingClientRect().width)));
  box.innerHTML = '';
}

// Keys share a row equally unless a label needs more. If they cannot share one row, four keys go two by two; otherwise the strip stacks.
function fitKeys(root) {
  for (const k of root.querySelectorAll('.keys')) {
    k.classList.remove('is-two', 'is-stack');
    if (k.scrollWidth <= k.clientWidth + 0.5) continue;
    if (k.children.length === 4) { k.classList.add('is-two'); if (k.scrollWidth <= k.clientWidth + 0.5) continue; k.classList.remove('is-two'); }
    k.classList.add('is-stack');
  }
}

function render(o) {

  tieWidows(tpl.content);
  morph($('#phone'), tpl.content.firstElementChild);

      for (const p of r.problems) problems.push(`${link}, in the 360 × 800 frame: ${p}`);
      if (r.home) {
        if (ts === '100' && r.home.over) problems.push(`${link}: Home scrolls at 100% text in the 360 × 800 frame, ${r.home.over} dp too tall`);
        if (r.home.leverBottom > r.home.fold + 0.05) problems.push(`${link}: in the 360 × 800 frame the lever ends at ${r.home.leverBottom}, below the fold at ${r.home.fold}`);
        groups[[S.data, ts === '100' ? '100%' : '135%', clock, hindi() ? 'Hindi' : 'English'].join(', ')] = [r.home.leverTop, r.home.display, r.home.stripsBottom].join(' / ');
        if (id === 'home-block' && ts === '100' && clock === '24h') frame = { display: M.winH, bay: M.bayH, strips: r.home.stripsBottom, fold: r.home.fold, line: parseFloat(getComputedStyle($('#phone .say')).lineHeight) };
      }
      if (onStep) onStep(++n);
      if (n % 6 === 0) await new Promise(res => setTimeout(res, 0));
    }
  } finally { root.classList.remove('ref'); M.key = ''; }
  return { key: refKey(ids), lines: lines.join(''), home: groups, frame, problems };
}

// Leaves the prototype on the screen it started from.
async function selfTest(o) {
  o = o || {};
  const t0 = Date.now(), keep = { theme: S.theme, ts: S.ts, clock: S.clock, ad: S.ad, motion: S.motion, shot: S.shot, frame: S.frame, preset: S.preset };
  await loadFonts();
  const all = PRESETS.map(p => p[0]), ids = all.filter(id => !o.filter || id.indexOf(o.filter) >= 0);
  const total = ids.length * 8 - (ids.indexOf('home-135') >= 0 ? 4 : 0), steps = total + (o.filter ? 0 : all.length * 4);
  const problems = [], groups = {}, chars = new Set();
  let n = 0, last = null, over100 = 0, same = null, ref = null;
  S.testing = true;
  S.frame = false;   // first the app at this window's own size
  try {
    for (const id of ids) for (const c of TEST_COMBOS) {
      if (id === 'home-135' && c[1] === '100') continue;
      const link = [id].concat(c, ['loaded'], keep.shot ? ['shot'] : []).join('.');
      applyLink(link);
      const r = last = checkNow();
      n++;
      for (const p of r.problems) problems.push(link + ': ' + p);
      for (const ch of $('#phone').textContent) chars.add(ch);
      if (r.home) {
        // the fold is a rule for a whole screen of 800 dp; a browser tab is shorter by its own bars
        if (r.h >= 799.5) {
          if (c[1] === '100' && r.home.over) problems.push(`${link}: Home scrolls at 100% text, ${r.home.over} dp too tall`);
          if (r.home.leverBottom > r.home.fold + 0.05) problems.push(`${link}: the lever ends at ${r.home.leverBottom}, below the fold at ${r.home.fold}`);
        } else if (c[1] === '100') over100 = Math.max(over100, r.home.over);
        const g = [S.data, c[1] === '100' ? '100%' : '135%', c[2], hindi() ? 'Hindi' : 'English'].join(', ');
        (groups[g] = groups[g] || {})[[r.home.leverTop, r.home.display, r.home.stripsBottom].join(' / ')] = true;
      }
      if (o.onStep) o.onStep(n, steps);
      if (n % 6 === 0) await new Promise(res => setTimeout(res, 0));
    }
    for (const ch of strayCharacters(Array.from(chars).filter(ch => /\S/.test(ch)))) problems.push(`“${ch}” (U+${ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')}) is not in the embedded typefaces, so each phone draws it in a font of its own`);
    // then the frame: the rules again, and sameness against the reference that tools/reference.js wrote into this file
    if (!o.filter) {
      ref = await framePass(all, k => { if (o.onStep) o.onStep(n + k, steps); });
      const seen = new Set(problems.map(p => p.replace(/\.shot\b/, '').replace(', in the 360 × 800 frame', '')));
      for (const p of ref.problems) if (!seen.has(p.replace(/\.shot\b/, '').replace(', in the 360 × 800 frame', ''))) problems.push(p);
      if (typeof REFERENCE === 'object' && REFERENCE && REFERENCE.key === ref.key && REFERENCE.lines.length === ref.lines.length) {
        same = { lines: [], home: [] };
        let i = 0;
        for (const id of all) for (const ts of ['100%', '135%']) for (const clock of ['24h', '12h']) {
          if (REFERENCE.lines.substr(i * 5, 5) !== ref.lines.substr(i * 5, 5)) same.lines.push(`${id}, ${ts}, ${clock}`);
          i++;
        }
        for (const g in REFERENCE.home) {
          const a = String(REFERENCE.home[g]).split(' / ').map(Number), b = String(ref.home[g] || '').split(' / ').map(Number);
          if (a.some((v, j) => !(Math.abs(v - b[j]) <= 0.6))) same.home.push(`${g}: ${ref.home[g]} here, ${REFERENCE.home[g]} in the reference`);
        }
        if (same.lines.length) problems.push(`Text breaks at different words than in the reference browser, in ${plural(same.lines.length, 'state', 'states')}: ${same.lines.slice(0, 12).join('; ')}${same.lines.length > 12 ? '; …' : ''}`);
        for (const h of same.home) problems.push('Home sits differently than in the reference browser (lever top / display height / strips bottom). ' + h);
      }
    }
  } finally {
    S.testing = false;
    S.theme = keep.theme; S.ts = keep.ts; S.clock = keep.clock; S.motion = keep.motion; S.shot = keep.shot; S.frame = keep.frame;
    applyPreset(keep.preset || 'home-block', true);
    S.ad = keep.ad;
    render({ still: true });
  }
  const home = {};
  for (const g in groups) {
    const v = Object.keys(groups[g]);
    home[g] = v.join(' and ');
    if (v.length > 1) problems.push(`Home moves between states (${g}): lever top / display height / strips bottom are ${v.join(' and ')}`);
  }
  return { ok: !problems.length, states: n, problems, browser: navigator.userAgent, window: [window.innerWidth, window.innerHeight], app: last ? [last.w, last.h] : null,
    scale: last ? last.scale : 1, frameChecked: !!ref, homeOver: over100, home, reference: ref && { key: ref.key, lines: ref.lines, home: ref.home, frame: ref.frame }, sameChecked: !!same,
    signature: ref ? hash5(ref.lines).toUpperCase() : null, ms: Date.now() - t0 };
}

function selfTestReport(r) {
  const s = [], full = r.app[1] >= 799.5;
  s.push(r.ok ? `No problems in ${r.states} states.` : `${plural(r.problems.length, 'problem', 'problems')} in ${r.states} states.`);
  s.push('');
  s.push(`Browser: ${r.browser}`);
  s.push(`Window: ${r.window[0]} × ${r.window[1]}.`);
  s.push('Checked: every screen and state, in both themes, at 100% and 135% text, with both clocks.');
  s.push('Rules: nothing off the edge or cut off; every target at least 48 dp; nothing under the display moves between Home’s states; every character from the embedded typefaces.');
  s.push(`At this screen’s own size, ${r.app[0]} × ${r.app[1]} dp: the rules above` + (full ? ', and Home’s fold.' : `. Home’s fold is a rule for 800 dp of height${r.homeOver ? `; at 100% text Home is ${r.homeOver} dp taller than this window` : ''}.`));
  if (r.frameChecked) s.push('In the 360 × 800 frame: the rules above, and Home’s fold. At 100% text Home does not scroll; at 135% the lever stays above the fold.');
  if (r.signature) s.push(r.sameChecked
    ? `Same as the reference: ${r.problems.some(p => /reference browser/.test(p)) ? 'no, see below' : 'yes'}. In the frame every line breaks where it does in the reference browser, and Home sits where it does there. Signature ${r.signature}: two phones that show the same signature draw the same lines.`
    : `Signature ${r.signature}. No reference is built into this file to compare it with.`);
  if (r.app[0] < 360) s.push(`This screen is ${r.app[0]} dp wide. The design is specified from 360 dp. Browser zoom or a large system font size narrows a page.`);
  s.push(`Took ${(r.ms / 1000).toFixed(1)} s.`);
  if (r.problems.length) { s.push(''); s.push('Problems:'); r.problems.forEach(p => s.push('- ' + p)); }
  return s.join('\n');
}

let selfTestBusy = false;
async function runSelfTestUI() {
  if (selfTestBusy) return;
  selfTestBusy = true;
  let el = $('#stest');
  if (!el) {
    el = document.createElement('div');
    el.id = 'stest'; el.className = 'stest'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Self-check');
    el.innerHTML = '<div class="stest-in"><h1>Self-check</h1><p id="stestSay" aria-live="polite"></p><pre id="stestOut" tabindex="0"></pre><p><button class="pbtn" id="stestClose">Close</button></p></div>';
    document.body.appendChild(el);
    $('#stestClose').addEventListener('click', () => { if (!selfTestBusy) el.remove(); });
  }
  const say = $('#stestSay'), outEl = $('#stestOut');
  outEl.textContent = '';
  say.textContent = 'Checking…';
  try {
    const r = await selfTest({ onStep: (n, total) => { if (n % 12 === 0) say.textContent = `Checking ${n} of ${total}…`; } });
    say.textContent = r.ok ? 'No problems.' : plural(r.problems.length, 'problem', 'problems') + '.';
    outEl.textContent = selfTestReport(r);
  } catch (e) {
    say.textContent = 'The check stopped.';
    outEl.textContent = String((e && e.stack) || e);
  }
  selfTestBusy = false;
}

function fit() {
  const stage = $('#stage');
  // on the bench the frame shrinks to the window's height. On a phone the frame is real size where it fits and shrunk where it
  // does not; without the frame the app is the window.
  K = window.innerWidth >= 600 ? Math.min(1, Math.max(0.5, (stage.clientHeight - 40) / 800))
    : S.frame && !S.shot ? Math.min(1, window.innerWidth / 360, window.innerHeight / 800) : 1;
  stage.style.setProperty('--k', K);
}

function wirePanel() {
  const panel = $('#panel');
  panel.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.tab) { S.tab = t.dataset.tab; drawPanel(true); return; }
    if (t.dataset.sw) { setSw(t.dataset.sw, t.dataset.v); return; }
    if (t.dataset.preset) { applyPreset(t.dataset.preset); if (!window.matchMedia('(min-width:1020px)').matches) closePanel(); return; }
    if (t.id === 'panelClose') { closePanel(); return; }
    if (t.hasAttribute('data-selftest')) { runSelfTestUI(); return; }
    if (t.hasAttribute('data-fs')) {
      fullScreen(() => { const msg = $('#fsMsg'); if (msg) msg.textContent = 'This viewer does not allow full screen. Open the HTML file itself in the browser to use it.'; });
    }
  });
}

const wantsSelfTest = () => /^#selftest\b/.test(location.hash);

function boot() {
  // start in the viewer's theme and motion setting
  const rootTheme = document.documentElement.getAttribute('data-theme');
  S.theme = rootTheme === 'dark' || rootTheme === 'light' ? rootTheme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) S.motion = 'reduced';
  resetApp('heavy');
  wire(); wirePanel(); fit();
  if (wantsSelfTest() || !applyHash()) render({ still: true });
  const relayout = () => { fit(); M.key = ''; render({ still: true }); };
  window.addEventListener('resize', relayout);
  window.addEventListener('hashchange', () => { if (wantsSelfTest()) runSelfTestUI(); else applyHash(); });
  const onFullScreen = () => { if (fsOn()) closePanel(); relayout(); };
  document.addEventListener('fullscreenchange', onFullScreen);
  document.addEventListener('webkitfullscreenchange', onFullScreen);
  loadFonts().then(relayout);
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', relayout);
  window.scarletPrototype = { presets: PRESETS.map(p => p[0]), apply: applyPreset, link: applyLink, state: S, metrics: M, check: checkNow, selfTest, dump: link => { applyLink(link); return layoutDump(); } };
  if (wantsSelfTest()) runSelfTestUI();
}
